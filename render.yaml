services:
  - type: web
    name: formulationos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run FormulationOS_Complete.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CLAUDE_API_KEY
        sync: false
      - key: CLAUDE_BASE_URL
        value: https://www.cun.ai
      - key: GPT_API_KEY
        sync: false
      - key: GPT_BASE_URL
        value: https://api.openai.com/v1
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_BASE_URL
        value: https://api.minimaxi.com/v1
